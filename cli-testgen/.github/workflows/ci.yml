name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: cli-testgen

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Run test suite (offline - mock provider, no API key)
        run: pytest tests -q

      - name: Smoke-run the CLI end-to-end (offline)
        run: testgen tests/fixtures/add.py --provider mock
